<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音結合韻互動點讀板 - 三主題雲端跨機版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <header class="w-full max-w-6xl flex flex-wrap justify-between items-center bg-slate-800/85 backdrop-blur border border-slate-700 p-4 rounded-2xl shadow-xl mb-4">
        <div class="flex items-center space-x-3">
            <div class="bg-cyan-500/20 text-cyan-400 p-3 rounded-xl border border-cyan-500/30">
                <i class="fa-solid fa-volume-high text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">注音結合韻互動點讀板</h1>
                <p class="text-xs text-slate-400">三組背景主題與語音點讀・跨裝置雲端即時同步</p>
            </div>
        </div>

        <div class="flex items-center space-x-3 mt-3 sm:mt-0 flex-wrap gap-2">
            <span id="sync-status" class="text-xs px-3 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud text-emerald-400"></i> 雲端同步已就緒
            </span>
            <button onclick="loadFromCloud()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition-all flex items-center gap-1.5 shadow cursor-pointer" title="從資料庫重新載入資料">
                <i class="fa-solid fa-rotate"></i> 讀取資料庫
            </button>
            <button id="mode-toggle-btn" onclick="toggleEditMode()" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-sm font-semibold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-pen-to-square"></i> <span id="mode-text">進入編輯模式</span>
            </button>
            <button onclick="saveToCloud()" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-sm font-semibold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up"></i> 儲存至雲端
            </button>
        </div>
    </header>

    <main class="w-full max-w-6xl flex-grow flex flex-col items-center justify-center relative">
        
        <!-- Three Theme Selectors -->
        <div class="w-full max-w-4xl mb-3 flex flex-wrap items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700/80 gap-2">
            <span class="text-xs text-slate-300 font-semibold flex items-center gap-1.5">
                <i class="fa-solid fa-images text-cyan-400"></i> 三組背景主題與上傳切換：
            </span>
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="switchTheme(0)" id="theme-btn-0" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 text-white transition shadow cursor-pointer">主題一 (海洋表)</button>
                <button onclick="switchTheme(1)" id="theme-btn-1" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition cursor-pointer">主題二 (森林表)</button>
                <button onclick="switchTheme(2)" id="theme-btn-2" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition cursor-pointer">主題三 (太空表)</button>
            </div>
        </div>

        <div id="board-container" class="relative w-full max-w-4xl shadow-2xl rounded-2xl overflow-hidden border-4 border-slate-700 bg-slate-900 aspect-[4/3]">
            <img id="bg-image" src="" alt="注音結合韻表" class="w-full h-full object-cover select-none">
            <div id="hotspots-layer" class="absolute inset-0"></div>
            <div id="draw-overlay" class="absolute inset-0 cursor-crosshair hidden bg-black/20 backdrop-blur-[1px]"></div>
        </div>

        <div id="editor-panel" class="w-full max-w-4xl mt-4 bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-xl hidden flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-purple-500/20 text-purple-400 p-2.5 rounded-lg border border-purple-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white">熱區與背景上傳工具箱</h3>
                    <p class="text-xs text-slate-400">在上圖拖曳繪製觸碰區塊，或上傳圖片變更當前主題背景</p>
                </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
                <label class="px-3 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 cursor-pointer shadow">
                    <i class="fa-solid fa-upload"></i> 上傳此主題背景圖片
                    <input type="file" id="bg-file-input" accept="image/*" class="hidden" onchange="handleBgImageUpload(event)">
                </label>
                <button onclick="startDrawing()" id="draw-btn" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-plus"></i> 新增觸碰熱區
                </button>
                <button onclick="clearAllHotspots()" class="px-3 py-2 bg-rose-600/80 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-trash"></i> 清空全部熱區
                </button>
            </div>
        </div>
    </main>

    <div id="property-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-cyan-400"></i> 設定觸碰區塊與點擊語音
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">區塊名稱 / 字彙標題</label>
                    <input type="text" id="prop-title" placeholder="例如：天上的月亮" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">點擊語音 (跨裝置朗讀內容)</label>
                    <textarea id="prop-speech" rows="3" placeholder="輸入當點擊時要朗讀的語音文字..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button onclick="testSpeech()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold rounded-xl transition flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-volume-high text-cyan-400"></i> 測試發音
                    </button>
                    <button onclick="saveHotspotProp()" class="flex-1 py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold rounded-xl transition flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-check"></i> 確定
                    </button>
                </div>

                <div class="pt-2 border-t border-slate-700 flex justify-between items-center">
                    <button onclick="deleteSelectedHotspot()" class="text-xs text-rose-400 hover:text-rose-300 flex items-center gap-1 transition cursor-pointer">
                        <i class="fa-solid fa-trash-can"></i> 刪除此熱區
                    </button>
                    <span id="active-hotspot-id" class="text-xs text-slate-500">ID: none</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfa5l4JlbI08cUgTw-beR5RTR3mXtVy7Y",
            authDomain: "personal-cc55d.firebaseapp.com",
            projectId: "personal-cc55d",
            storageBucket: "personal-cc55d.firebasestorage.app",
            messagingSenderId: "513967977877",
            appId: "1:513967977877:web:3d642bab1586b9179d729c",
            measurementId: "G-SBCNWGZ8SB"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'zhuyin-multitheme-v8';
        
        let app = null;
        let auth = null;
        let db = null;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase init notice:", e);
        }

        // Three theme definitions supporting custom uploaded backgrounds & hotspots
        let themes = [
            {
                name: "主題一 (海洋表)",
                url: "https://placehold.co/1200x900/0f172a/38bdf8?text=%E6%B5%B7%E6%B4%8B%E6%8B%BC%E8%AE%80%E8%A1%A8",
                hotspots: [
                    { id: 'm1', x: 4.5, y: 3.5, w: 12, h: 22, title: '天上的月亮', speech: '天上的月亮' },
                    { id: 'm2', x: 21, y: 3.5, w: 12, h: 22, title: '彎彎的軌道', speech: '彎彎的軌道' },
                    { id: 'm3', x: 37.5, y: 3.5, w: 12, h: 22, title: '青蛙跳高高', speech: '青蛙跳高高' },
                    { id: 'm4', x: 53.5, y: 3.5, w: 12, h: 22, title: '游向煉魚', speech: '游向煉魚' },
                    { id: 'm5', x: 70, y: 3.5, w: 12, h: 22, title: '鴨子呱呱叫', speech: '鴨子呱呱叫' }
                ]
            },
            {
                name: "主題二 (森林表)",
                url: "https://placehold.co/1200x900/065f46/34d399?text=%E6%A3%AE%E6%9E%77%E6%8B%BC%E8%AE%80%E8%A1%A8",
                hotspots: [
                    { id: 'f1', x: 10, y: 15, w: 20, h: 30, title: '大樹公公', speech: '大樹公公說哈囉' },
                    { id: 'f2', x: 40, y: 15, w: 20, h: 30, title: '可愛小松鼠', speech: '小松鼠愛吃松果' }
                ]
            },
            {
                name: "主題三 (太空表)",
                url: "https://placehold.co/1200x900/311042/c084fc?text=%E5%A4%AA%E7%A9%BA%E6%8E%A2%E7%B4%A2%E8%A1%A8",
                hotspots: [
                    { id: 's1', x: 15, y: 20, w: 25, h: 35, title: '閃亮星星', speech: '閃亮亮的星星發光' },
                    { id: 's2', x: 60, y: 20, w: 25, h: 35, title: '火箭升空', speech: '火箭準備發射' }
                ]
            }
        ];

        let currentThemeIndex = 0;
        let isEditMode = false;
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentSelectedId = null;
        let tempRect = null;
        let unsub = null;

        const bgImg = document.getElementById('bg-image');
        bgImg.src = themes[0].url;
        bgImg.onerror = function() {
            this.src = "https://placehold.co/1200x900/1e293b/38bdf8?text=注音拼讀表載入失敗";
        };

        function getCloudDocRef() {
            if (!db) return null;
            return doc(db, 'artifacts', appId);
        }

        async function initFirebaseAndSync() {
            try {
                if (auth) {
                    await signInAnonymously(auth);
                }
                updateSyncStatus('已連線雲端資料庫', 'emerald');
                await loadFromCloud();

                const docRef = getCloudDocRef();
                if (docRef) {
                    if (unsub) unsub();
                    unsub = onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.themes && Array.isArray(data.themes)) {
                                themes = data.themes;
                            }
                            if (typeof data.themeIndex === 'number') {
                                currentThemeIndex = data.themeIndex;
                            }
                            updateThemeButtonsUI();
                            updateActiveThemeView();
                        }
                    }, (err) => {
                        console.warn("Snapshot notice:", err);
                    });
                }
            } catch (error) {
                console.warn("Cloud connection notice:", error);
                updateSyncStatus('已啟用本機與跨分頁同步', 'emerald');
                loadFromLocalStorage();
                updateActiveThemeView();
            }
        }

        function updateSyncStatus(text, color) {
            const statusEl = document.getElementById('sync-status');
            if (!statusEl) return;
            if (color === 'emerald') {
                statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400"></i> ${text}`;
                statusEl.className = 'text-xs px-3 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full flex items-center gap-1.5';
            } else {
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> ${text}`;
                statusEl.className = 'text-xs px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full flex items-center gap-1.5';
            }
        }

        function loadFromLocalStorage() {
            const local = localStorage.getItem('zhuyin_backup_' + appId);
            if (local) {
                try {
                    const parsed = JSON.parse(local);
                    if (parsed.themes) themes = parsed.themes;
                    if (typeof parsed.currentThemeIndex === 'number') currentThemeIndex = parsed.currentThemeIndex;
                    updateThemeButtonsUI();
                } catch (e) {
                    console.error("Local parse error:", e);
                }
            }
        }

        async function saveToCloud() {
            updateSyncStatus('正在儲存設定...', 'cyan');
            
            // Always save to localStorage immediately for instant cross-tab sync
            localStorage.setItem('zhuyin_backup_' + appId, JSON.stringify({ themes, currentThemeIndex }));
            
            // Try saving to Firestore if available
            try {
                const docRef = getCloudDocRef();
                if (docRef) {
                    await setDoc(docRef, {
                        themes: themes,
                        themeIndex: currentThemeIndex,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                }
                updateSyncStatus('雲端與本機儲存成功', 'emerald');
                setTimeout(() => updateSyncStatus('已連線雲端資料庫', 'emerald'), 2500);
            } catch (e) {
                console.warn("Cloud save notice:", e);
                updateSyncStatus('已儲存至本機與跨分頁同步', 'emerald');
            }
        }

        async function loadFromCloud() {
            updateSyncStatus('讀取資料庫中...', 'cyan');
            try {
                const docRef = getCloudDocRef();
                let loaded = false;
                if (docRef) {
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.themes && Array.isArray(data.themes)) {
                            themes = data.themes;
                        }
                        if (typeof data.themeIndex === 'number') {
                            currentThemeIndex = data.themeIndex;
                        }
                        loaded = true;
                    }
                }
                if (!loaded) {
                    loadFromLocalStorage();
                }
                updateThemeButtonsUI();
                updateActiveThemeView();
                updateSyncStatus('已成功讀取最新設定', 'emerald');
                setTimeout(() => updateSyncStatus('已連線雲端資料庫', 'emerald'), 2500);
            } catch (err) {
                console.warn("Load notice:", err);
                loadFromLocalStorage();
                updateThemeButtonsUI();
                updateActiveThemeView();
                updateSyncStatus('已從本機讀取最新設定', 'emerald');
            }
        }

        function switchTheme(index) {
            currentThemeIndex = index;
            updateThemeButtonsUI();
            updateActiveThemeView();
        }

        function updateThemeButtonsUI() {
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`theme-btn-${i}`);
                if (!btn) continue;
                if (i === currentThemeIndex) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 text-white transition shadow cursor-pointer";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition cursor-pointer";
                }
            }
        }

        function updateActiveThemeView() {
            const theme = themes[currentThemeIndex];
            bgImg.src = theme.url || "https://placehold.co/1200x900/1e293b/38bdf8?text=請上傳背景圖片";
            renderHotspots();
        }

        function handleBgImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1000;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const optimizedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                    themes[currentThemeIndex].url = optimizedDataUrl;
                    updateActiveThemeView();
                    saveToCloud();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderHotspots() {
            const layer = document.getElementById('hotspots-layer');
            if (!layer) return;
            layer.innerHTML = '';

            const currentHotspots = themes[currentThemeIndex].hotspots || [];
            currentHotspots.forEach(h => {
                const div = document.createElement('div');
                div.className = `absolute border-2 rounded-xl transition-all flex items-center justify-center cursor-pointer group ${
                    isEditMode 
                        ? 'border-cyan-400 bg-cyan-500/20 hover:bg-cyan-500/40 shadow-lg' 
                        : 'border-transparent hover:border-amber-400/80 hover:bg-amber-400/10'
                }`;
                div.style.left = h.x + '%';
                div.style.top = h.y + '%';
                div.style.width = h.w + '%';
                div.style.height = h.h + '%';
                div.dataset.id = h.id;

                if (isEditMode) {
                    div.innerHTML = `<span class="bg-slate-900/90 text-cyan-300 text-[10px] px-1.5 py-0.5 rounded border border-cyan-500/40 font-mono pointer-events-none">${h.title || '未命名'}</span>`;
                    div.onclick = (e) => {
                        e.stopPropagation();
                        openPropertyModal(h.id);
                    };
                } else {
                    div.onclick = (e) => {
                        e.stopPropagation();
                        playSpeech(h.speech || h.title);
                        triggerRipple(div);
                    };
                }

                layer.appendChild(div);
            });
        }

        function playSpeech(text) {
            if (!text) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function testSpeech() {
            const speechInput = document.getElementById('prop-speech');
            if (speechInput) playSpeech(speechInput.value);
        }

        function triggerRipple(element) {
            element.classList.add('bg-amber-400/30', 'scale-[1.02]');
            setTimeout(() => {
                element.classList.remove('bg-amber-400/30', 'scale-[1.02]');
            }, 300);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const modeText = document.getElementById('mode-text');
            const toggleBtn = document.getElementById('mode-toggle-btn');
            const editorPanel = document.getElementById('editor-panel');

            if (isEditMode) {
                if (modeText) modeText.innerText = '退出編輯模式';
                if (toggleBtn) toggleBtn.className = 'px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-sm font-semibold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer';
                if (editorPanel) {
                    editorPanel.classList.remove('hidden');
                    editorPanel.classList.add('flex');
                }
            } else {
                if (modeText) modeText.innerText = '進入編輯模式';
                if (toggleBtn) toggleBtn.className = 'px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-sm font-semibold rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer';
                if (editorPanel) {
                    editorPanel.classList.add('hidden');
                    editorPanel.classList.remove('flex');
                }
                const drawOverlay = document.getElementById('draw-overlay');
                if (drawOverlay) drawOverlay.classList.add('hidden');
                isDrawing = false;
            }
            renderHotspots();
        }

        function startDrawing() {
            const overlay = document.getElementById('draw-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        const container = document.getElementById('board-container');
        const overlay = document.getElementById('draw-overlay');

        if (overlay && container) {
            overlay.addEventListener('mousedown', (e) => {
                if (!isEditMode) return;
                isDrawing = true;
                const rect = container.getBoundingClientRect();
                startX = ((e.clientX - rect.left) / rect.width) * 100;
                startY = ((e.clientY - rect.top) / rect.height) * 100;

                tempRect = document.createElement('div');
                tempRect.className = 'absolute border-2 border-dashed border-yellow-400 bg-yellow-400/20 rounded-xl pointer-events-none';
                tempRect.style.left = startX + '%';
                tempRect.style.top = startY + '%';
                tempRect.style.width = '0%';
                tempRect.style.height = '0%';
                container.appendChild(tempRect);
            });

            overlay.addEventListener('mousemove', (e) => {
                if (!isDrawing || !tempRect) return;
                const rect = container.getBoundingClientRect();
                const currentX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
                const currentY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

                const width = Math.abs(currentX - startX);
                const height = Math.abs(currentY - startY);
                const left = Math.min(currentX, startX);
                const top = Math.min(currentY, startY);

                tempRect.style.left = left + '%';
                tempRect.style.top = top + '%';
                tempRect.style.width = width + '%';
                tempRect.style.height = height + '%';
            });

            overlay.addEventListener('mouseup', (e) => {
                if (!isDrawing) return;
                isDrawing = false;
                overlay.classList.add('hidden');
                if (tempRect) {
                    tempRect.remove();
                    const rect = container.getBoundingClientRect();
                    const endX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
                    const endY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

                    const w = Math.abs(endX - startX);
                    const h = Math.abs(endY - startY);
                    const x = Math.min(endX, startX);
                    const y = Math.min(endY, startY);

                    if (w > 2 && h > 2) {
                        const newId = 'hotspot_' + Date.now();
                        if (!themes[currentThemeIndex].hotspots) {
                            themes[currentThemeIndex].hotspots = [];
                        }
                        themes[currentThemeIndex].hotspots.push({
                            id: newId,
                            x: parseFloat(x.toFixed(2)),
                            y: parseFloat(y.toFixed(2)),
                            w: parseFloat(w.toFixed(2)),
                            h: parseFloat(h.toFixed(2)),
                            title: '新注音區塊',
                            speech: '請輸入朗讀文字'
                        });
                        renderHotspots();
                        openPropertyModal(newId);
                        saveToCloud();
                    }
                }
            });
        }

        function openPropertyModal(id) {
            currentSelectedId = id;
            const currentHotspots = themes[currentThemeIndex].hotspots || [];
            const h = currentHotspots.find(item => item.id === id);
            if (!h) return;

            const titleEl = document.getElementById('prop-title');
            const speechEl = document.getElementById('prop-speech');
            const idEl = document.getElementById('active-hotspot-id');
            const modalEl = document.getElementById('property-modal');

            if (titleEl) titleEl.value = h.title || '';
            if (speechEl) speechEl.value = h.speech || '';
            if (idEl) idEl.innerText = 'ID: ' + h.id;
            if (modalEl) modalEl.classList.remove('hidden');
        }

        function closeModal() {
            const modalEl = document.getElementById('property-modal');
            if (modalEl) modalEl.classList.add('hidden');
            currentSelectedId = null;
        }

        function saveHotspotProp() {
            if (!currentSelectedId) return;
            const currentHotspots = themes[currentThemeIndex].hotspots || [];
            const h = currentHotspots.find(item => item.id === currentSelectedId);
            if (h) {
                const titleEl = document.getElementById('prop-title');
                const speechEl = document.getElementById('prop-speech');
                if (titleEl) h.title = titleEl.value;
                if (speechEl) h.speech = speechEl.value;
            }
            closeModal();
            renderHotspots();
            saveToCloud();
        }

        function deleteSelectedHotspot() {
            if (!currentSelectedId) return;
            themes[currentThemeIndex].hotspots = (themes[currentThemeIndex].hotspots || []).filter(item => item.id !== currentSelectedId);
            closeModal();
            renderHotspots();
            saveToCloud();
        }

        function clearAllHotspots() {
            if (window.confirm("確定要清空目前主題的所有觸碰區塊嗎？")) {
                themes[currentThemeIndex].hotspots = [];
                renderHotspots();
                saveToCloud();
            }
        }

        // Expose functions globally
        window.toggleEditMode = toggleEditMode;
        window.startDrawing = startDrawing;
        window.closeModal = closeModal;
        window.saveHotspotProp = saveHotspotProp;
        window.deleteSelectedHotspot = deleteSelectedHotspot;
        window.clearAllHotspots = clearAllHotspots;
        window.testSpeech = testSpeech;
        window.playSpeech = playSpeech;
        window.loadFromCloud = loadFromCloud;
        window.saveToCloud = saveToCloud;
        window.switchTheme = switchTheme;
        window.handleBgImageUpload = handleBgImageUpload;

        window.onload = function() {
            initFirebaseAndSync();
            
            // Cross-tab sync listener
            window.addEventListener('storage', (e) => {
                if (e.key === 'zhuyin_backup_' + appId && e.newValue) {
                    try {
                        const parsed = JSON.parse(e.newValue);
                        if (parsed.themes) themes = parsed.themes;
                        if (typeof parsed.currentThemeIndex === 'number') currentThemeIndex = parsed.currentThemeIndex;
                        updateThemeButtonsUI();
                        updateActiveThemeView();
                    } catch (err) {
                        console.error("Storage event parse error:", err);
                    }
                }
            });
        };
    </script>
</body>
</html>
